<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Kinus photo and video gallery.">
<title>Kinus Gallery</title>
<link rel="preload" href="assets/fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/theme.css?v=20261105f">
<link rel="stylesheet" href="assets/gallery-page.css?v=1">
</head>
<body class="gp">
<main class="gp-main">
<section id="gallery" class="gallery" aria-label="Kinus photos and videos" hidden><a class="gal-callout" href="https://youngshluchim.org/pictures" target="_blank" rel="noopener noreferrer"><span class="gal-callout-icon" aria-hidden="true">📸</span><span class="gal-callout-text">Send in your photos to be featured!<b>youngshluchim.org/pictures</b></span></a><div class="gal-track" tabindex="0"></div></section>
<p class="gp-empty" id="gp-empty">Loading photos…</p>
</main>
<script src="assets/gallery.js?v=1" defer></script>
<script>(function(){const g=document.getElementById("gallery"),n=document.getElementById("gp-empty");new MutationObserver(()=>{if(!g.hidden)n.remove();}).observe(g,{attributes:true,attributeFilter:["hidden"]});setTimeout(()=>{if(g.hidden)n.textContent="Photos are coming soon!";},10000);})();</script>
</body>
</html>
